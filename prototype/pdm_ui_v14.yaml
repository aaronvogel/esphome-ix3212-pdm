## PDM Controller - on-device prototype of the Claude Design screens.
## Overview (2x3 swipe pages per PDM) -> channel detail (swipe between channels)
## -> gear -> name. Static mock data; controls change on screen only.
## Generated by gen2.py. UNVERIFIED keys are flagged in chat - paste any error.

esphome:
  name: pdm-controller
  friendly_name: PDM Controller

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: PDM Controller Fallback Hotspot
    password: !secret wifi_ap_password

captive_portal:

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [axp2101, aw88298, aw9523b]

i2c:
  - id: bus_internal
    sda: GPIO12
    scl: GPIO11

spi:
  - id: spi_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

axp2101:
  id: axp2101_pmu
  i2c_id: bus_internal

aw9523b:
  - id: aw9523b_hub
    i2c_id: bus_internal

output:
  - platform: axp2101
    type: range
    channel: DLDO1
    id: lcd_backlight_output
    min_voltage: 2600
    max_voltage: 3300
  - platform: axp2101
    channel: ALDO1
    voltage: 1800
  - platform: axp2101
    channel: ALDO2
    voltage: 3300
  - platform: axp2101
    channel: BLDO1
    voltage: 2800
  - platform: axp2101
    channel: BLDO2
    voltage: 1500

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    entity_category: config
    output: lcd_backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

touchscreen:
  - platform: ft63x6
    id: touch
    update_interval: 16ms
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin: GPIO35
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 9
    cs_pin: GPIO3
    data_rate: 40MHz
    invert_colors: true
    id: m5cores3_lcd

globals:
- id: pdm1_page
  type: int
  initial_value: '0'
- id: pdm2_page
  type: int
  initial_value: '0'
- id: cur_pdm
  type: int
  initial_value: '1'
- id: cur_ch
  type: int
  initial_value: '1'
- id: spd_1_5
  type: int
  initial_value: '50'
- id: spd_2_5
  type: int
  initial_value: '60'
script:
- id: pdm1_bar
  parameters:
    page: int
  then:
  - globals.set:
      id: pdm1_page
      value: !lambda 'return page;'
  - if:
      condition:
        lambda: return page == 0;
      then:
      - lvgl.label.update:
          id: bar1_l
          text: CH 1-6
          text_color: 0xE8ECE6
      - lvgl.label.update:
          id: bar1_r
          text: CH 7-12 
          text_color: 0x9AA39C
      - lvgl.obj.update:
          id: bar1_d0
          bg_color: 0xE8ECE6
      - lvgl.obj.update:
          id: bar1_d1
          bg_color: 0x3A423D
      else:
      - lvgl.label.update:
          id: bar1_l
          text:  CH 1-6
          text_color: 0x9AA39C
      - lvgl.label.update:
          id: bar1_r
          text: CH 7-12
          text_color: 0xE8ECE6
      - lvgl.obj.update:
          id: bar1_d0
          bg_color: 0x3A423D
      - lvgl.obj.update:
          id: bar1_d1
          bg_color: 0xE8ECE6
- id: pdm2_bar
  parameters:
    page: int
  then:
  - globals.set:
      id: pdm2_page
      value: !lambda 'return page;'
  - if:
      condition:
        lambda: return page == 0;
      then:
      - lvgl.label.update:
          id: bar2_l
          text: CH 1-6
          text_color: 0xE8ECE6
      - lvgl.label.update:
          id: bar2_r
          text: CH 7-12 
          text_color: 0x9AA39C
      - lvgl.obj.update:
          id: bar2_d0
          bg_color: 0xE8ECE6
      - lvgl.obj.update:
          id: bar2_d1
          bg_color: 0x3A423D
      else:
      - lvgl.label.update:
          id: bar2_l
          text:  CH 1-6
          text_color: 0xFF6B5E
      - lvgl.label.update:
          id: bar2_r
          text: CH 7-12
          text_color: 0xE8ECE6
      - lvgl.obj.update:
          id: bar2_d0
          bg_color: 0xFF6B5E
      - lvgl.obj.update:
          id: bar2_d1
          bg_color: 0xE8ECE6
